############################################################
#
# Datasource config
#
############################################################
spring.datasource.name=awesome_video
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource

spring.datasource.druid.filters=stat
spring.datasource.druid.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.druid.url=jdbc:mysql://localhost:3306/awesome_video?useUnicode=true&characterEncoding=UTF-8
spring.datasource.druid.username=root
spring.datasource.druid.password=${DB_PASSWORD:root}
spring.datasource.druid.initial-size=1
spring.datasource.druid.min-idle=1
spring.datasource.druid.max-active=20
spring.datasource.druid.test-on-borrow=true

############################################################
#
# MyBatis config
#
############################################################
mybatis.type-aliases-package=com.lin.model
mybatis.mapper-locations=classpath:mappers/*.xml
logging.level.com.lin.dao=debug

mapper.mappers=com.lin.utils.MyMapper
mapper.not-empty=false
mapper.identity=MYSQL

pagehelper.helperDialect=mysql
pagehelper.reasonable=true
pagehelper.supportMethodsArguments=true
pagehelper.params=count=countSql

############################################################
#
# File upload config
#
############################################################
spring.servlet.multipart.max-file-size=1000000000
spring.servlet.multipart.max-request-size=10819030000
spring.servlet.multipart.location=${UPLOAD_TEMP_DIR:/tmp/video-upload-temp}

# Custom video upload and FFmpeg paths
video.upload.path=${VIDEO_UPLOAD_PATH:/tmp/video-upload}
ffmpeg.path=${FFMPEG_PATH:/usr/local/bin/ffmpeg}

############################################################
#
# Server config
#
############################################################
server.port=8080
server.tomcat.uri-encoding=UTF-8

############################################################
#
# Redis config
#
############################################################
spring.redis.database=1
spring.redis.host=127.0.0.1
spring.redis.port=6379
spring.redis.password=

############################################################
#
# DevTools config
#
############################################################
spring.devtools.restart.enabled=false
spring.devtools.add-properties=false

############################################################
#
# Actuator config
#
############################################################
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.shutdown.enabled=false
